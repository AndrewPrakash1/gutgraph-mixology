<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GutGraph Parliament — Agent Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .logo { font-size: 1.05rem; font-weight: 700; }
    .mode-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .mode-badge.live {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border-color: rgba(16, 185, 129, 0.3);
    }
    .back-link {
      margin-left: auto;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
    }
    .back-link:hover { color: var(--accent); }

    /* Layout */
    .layout { display: flex; flex: 1; min-height: 0; }

    /* Sidebar — the agent roster */
    aside {
      width: 250px;
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.5);
    }
    .roster-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 6px 10px;
    }
    .agent-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .agent-row.speaking { background: rgba(16, 185, 129, 0.08); }
    .agent-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      background: var(--bg);
      border: 2px solid var(--border);
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .agent-row.speaking .agent-avatar { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { border-color: var(--accent); } }
    .agent-meta { min-width: 0; }
    .agent-handle { font-size: 0.8rem; font-weight: 700; }
    .agent-role {
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      margin-left: auto;
      flex-shrink: 0;
    }
    .agent-dot.yes { background: var(--accent); }
    .agent-dot.no { background: var(--danger); }

    /* Chat */
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { display: flex; gap: 10px; max-width: 760px; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
    .msg .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
      background: var(--card);
      border: 2px solid var(--border);
      flex-shrink: 0;
    }
    .msg .body { min-width: 0; }
    .msg .who { font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
    .msg .who .vote-badge {
      font-size: 0.62rem;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .vote-badge.yes { background: rgba(16,185,129,0.15); color: var(--accent); }
    .vote-badge.no { background: rgba(239,68,68,0.15); color: var(--danger); }
    .msg .text {
      font-size: 0.88rem;
      line-height: 1.55;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.user .text {
      background: var(--accent);
      color: #06281d;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
    }
    .msg.agent .text { padding-top: 1px; }
    .cursor { display: inline-block; width: 7px; height: 14px; background: var(--accent); vertical-align: -2px; animation: blink 0.7s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Tool chips + system lines */
    .tool-chip {
      align-self: center;
      max-width: 90%;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 14px;
      animation: fadeIn 0.25s ease;
    }
    .tool-chip b { color: var(--accent); font-weight: 600; }
    .sys-line {
      align-self: center;
      font-size: 0.75rem;
      color: var(--muted);
      font-style: italic;
      animation: fadeIn 0.25s ease;
    }

    /* Result card */
    .result-card {
      align-self: center;
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      animation: fadeIn 0.4s ease;
    }
    .result-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .score-bubble {
      width: 58px; height: 58px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: 700;
      border: 3px solid var(--accent);
      flex-shrink: 0;
    }
    .result-drink-name { font-size: 1.15rem; font-weight: 700; }
    .result-ingredients { color: var(--accent); font-size: 0.78rem; margin-top: 2px; }
    .result-prep { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .gaps-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .gap-tag {
      background: rgba(239,68,68,0.15);
      color: var(--danger);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .chem-pill {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .disclaimer { font-size: 0.68rem; color: var(--muted); text-align: center; margin-top: 12px; opacity: 0.75; }

    /* Composer */
    .composer { border-top: 1px solid var(--border); padding: 12px 20px; background: var(--card); flex-shrink: 0; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
    .chip {
      flex-shrink: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 16px;
      padding: 6px 13px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .chip:hover { border-color: var(--accent); }
    .input-row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
    }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); }
    button.send {
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button.send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Mobile: roster becomes a horizontal strip */
    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      aside {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 4px;
        padding: 8px;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .roster-title { display: none; }
      .agent-row { flex-direction: column; gap: 4px; padding: 6px; min-width: 64px; text-align: center; }
      .agent-meta { text-align: center; }
      .agent-role { display: none; }
      .agent-dot { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🍹 GutGraph Parliament</div>
    <div class="mode-badge" id="modeBadge">…</div>
    <a class="back-link" href="index.html">← classic UI</a>
  </header>

  <div class="layout">
    <aside id="roster">
      <div class="roster-title">Gut Parliament · 8 agents</div>
    </aside>

    <main>
      <div id="thread">
        <div class="sys-line">Tell the Mixologist what you ate. Your gut microbes will vote on it.</div>
      </div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <input type="text" id="input" placeholder="e.g. I had maggi and chai…" autocomplete="off">
          <button class="send" id="sendBtn" onclick="send()">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API = 'http://localhost:8000';
    const MIXOLOGIST = { handle: 'MIXOLOGIST', name: 'Mixologist', emoji: '🍸', color: '#10b981' };
    const AGENT_INFO = { MIXOLOGIST };
    let currentMsg = null;   // the bubble currently being streamed into
    let busy = false;

    // ---------- roster + chips ----------
    async function boot() {
      try {
        const res = await fetch(API + '/agents');
        const data = await res.json();
        const badge = document.getElementById('modeBadge');
        badge.textContent = data.mode === 'live' ? 'live · deepseek' : 'demo mode';
        badge.classList.toggle('live', data.mode === 'live');
        renderRoster(data.agents);
      } catch {
        document.getElementById('modeBadge').textContent = 'backend offline';
      }
      const meals = [
        ['🍜🥤', 'Noodles + Coke'], ['🍛🥛', 'Rajma + Lassi'], ['🍔🍟', 'Burger + Fries'],
        ['🍽️☕', 'Idli + Coffee'], ['🍜☕', 'Maggi + Chai'],
      ];
      document.getElementById('chips').innerHTML = meals.map(([e, n]) =>
        `<button class="chip" onclick="quickSend('${n}')">${e} ${n}</button>`).join('');
    }

    function renderRoster(agents) {
      const aside = document.getElementById('roster');
      aside.innerHTML = '<div class="roster-title">Gut Parliament · 8 agents</div>';
      for (const a of agents) {
        AGENT_INFO[a.handle] = a;
        const row = document.createElement('div');
        row.className = 'agent-row';
        row.id = 'row-' + a.handle;
        row.innerHTML = `
          <div class="agent-avatar" style="border-color:${a.color}44">${a.emoji}</div>
          <div class="agent-meta">
            <div class="agent-handle" style="color:${a.color}">${a.handle}</div>
            <div class="agent-role">${a.role}</div>
          </div>
          <div class="agent-dot" id="dot-${a.handle}"></div>`;
        aside.appendChild(row);
      }
    }

    // ---------- message rendering ----------
    function addUserMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.innerHTML = `<div class="body"><div class="text"></div></div>`;
      el.querySelector('.text').textContent = text;
      thread.appendChild(el);
      scrollDown();
    }

    function startAgentMsg(agent) {
      if (currentMsg) {                      // previous speaker never got a vote event
        currentMsg.querySelector('.cursor')?.remove();
        markSpeaking(currentMsg.dataset.handle, false);
      }
      const info = AGENT_INFO[agent.handle] || agent;
      const el = document.createElement('div');
      el.className = 'msg agent';
      el.dataset.handle = agent.handle;
      el.innerHTML = `
        <div class="avatar" style="border-color:${info.color}">${info.emoji}</div>
        <div class="body">
          <div class="who" style="color:${info.color}">${info.handle}</div>
          <div class="text"><span class="cursor"></span></div>
        </div>`;
      thread.appendChild(el);
      currentMsg = el;
      markSpeaking(agent.handle, true);
      scrollDown();
    }

    function appendToken(delta) {
      if (!currentMsg) return;
      const textEl = currentMsg.querySelector('.text');
      const cursor = textEl.querySelector('.cursor');
      cursor.insertAdjacentText('beforebegin', delta);
      scrollDown();
    }

    function finishAgentMsg(handle, vote) {
      if (!currentMsg) return;
      currentMsg.querySelector('.cursor')?.remove();
      if (vote) {
        const badge = document.createElement('span');
        badge.className = 'vote-badge ' + vote;
        badge.textContent = vote === 'yes' ? '✓ approves' : '✗ flags it';
        currentMsg.querySelector('.who').appendChild(badge);
        const dot = document.getElementById('dot-' + handle);
        if (dot) dot.className = 'agent-dot ' + vote;
      }
      markSpeaking(handle, false);
      currentMsg = null;
      scrollDown();
    }

    function addToolChip(tool, output) {
      const el = document.createElement('div');
      el.className = 'tool-chip';
      let detail = '';
      if (output.gut_score !== undefined)
        detail = ` → score ${output.gut_score}/10 · fibre ${output.fibre_per_100}g/100g · sugar ${output.sugar_per_100}g/100g`;
      if (output.drink)
        detail = ` → ${output.drink} · ${output.shared_molecules} shared molecules · sim ${output.similarity_score}`;
      el.innerHTML = `⚙ <b>${tool}</b>${detail}`;
      thread.appendChild(el);
      scrollDown();
    }

    function addSysLine(text) {
      const el = document.createElement('div');
      el.className = 'sys-line';
      el.textContent = text;
      thread.appendChild(el);
      scrollDown();
    }

    function addResultCard(r) {
      const d = r.drink;
      const scoreColor = r.gut_score < 4 ? 'var(--danger)' : r.gut_score < 7 ? '#f59e0b' : 'var(--accent)';
      const el = document.createElement('div');
      el.className = 'result-card';
      el.innerHTML = `
        <div class="result-head">
          <div class="score-bubble" style="border-color:${scoreColor};color:${scoreColor}">${r.gut_score.toFixed(1)}</div>
          <div>
            <div class="result-drink-name">${d.emoji} ${d.name}</div>
            <div class="result-ingredients">${d.ingredients.join(' · ')}</div>
          </div>
        </div>
        <div class="result-prep">${d.prep}</div>
        <div class="gaps-list">${r.gaps.map(g => `<span class="gap-tag">${g}</span>`).join('') || '<span class="gap-tag" style="background:rgba(16,185,129,.15);color:var(--accent)">✓ well balanced</span>'}</div>
        <div class="chem-pill">Parliament ${r.tally.yes}/${r.tally.total} · Similarity ${d.similarity_score} · ${d.shared_molecules} molecules</div>
        <div class="disclaimer">⚠️ Concept mockup for Fork It 2026. Gut scores and agent votes are simulated — not medical advice.</div>`;
      thread.appendChild(el);
      scrollDown();
    }

    function markSpeaking(handle, on) {
      document.getElementById('row-' + handle)?.classList.toggle('speaking', on);
    }

    function scrollDown() {
      requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
    }

    function resetDots() {
      document.querySelectorAll('.agent-dot').forEach(d => d.className = 'agent-dot');
    }

    // ---------- SSE over POST ----------
    function quickSend(text) {
      if (busy) return;
      document.getElementById('input').value = text;
      send();
    }

    async function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      resetDots();
      addUserMsg(text);

      try {
        const res = await fetch(API + '/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split('\n\n');
          buffer = frames.pop();               // last chunk may be incomplete
          for (const frame of frames) {
            const line = frame.trim();
            if (!line.startsWith('data:')) continue;
            handleEvent(JSON.parse(line.slice(5)));
          }
        }
      } catch (err) {
        addSysLine('⚠ connection lost — is the backend running on port 8000?');
      }

      finishAgentMsg();
      busy = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    function handleEvent(ev) {
      switch (ev.event) {
        case 'agent_start': startAgentMsg(ev.agent); break;
        case 'token':       appendToken(ev.delta); break;
        case 'vote':        finishAgentMsg(ev.agent, ev.vote); break;
        case 'meal':        addSysLine(`parsed: ${ev.meal.emoji} ${ev.meal.name} — ${ev.meal.ingredients.join(', ')}`); break;
        case 'tool':        addToolChip(ev.tool, ev.output); break;
        case 'tally':       addSysLine(`🗳 parliament: ${ev.yes}/${ev.total} approve`); break;
        case 'result':      addResultCard(ev.result); break;
        case 'unknown_meal': /* Mixologist's message already explains it */ break;
        case 'done':        break;
      }
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter') send();
    });
    boot();
  </script>
</body>
</html>
